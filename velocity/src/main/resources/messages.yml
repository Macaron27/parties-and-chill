# ┌──────────────────────────────────────────────────────────────┐
# │               Parties & Chill — messages                     │
# └──────────────────────────────────────────────────────────────┘
# Format: MiniMessage — https://docs.advntr.dev/minimessage/format.html
# Velocity converts everything per client: RGB/gradients on 1.16+, the
# nearest legacy color on 1.8 – 1.15.
#
# Available in every message:  <prefix>  <separator>
# Player names and chat text are inserted as plain text (never parsed),
# so players cannot inject formatting or click events.
# Keys missing from this file fall back to the built-in defaults.

prefix: "<gradient:#a78bfa:#38bdf8><bold>PARTY</bold></gradient> <dark_gray>»</dark_gray> "
separator: "<gradient:#a78bfa:#38bdf8><strikethrough>                                                            </strikethrough></gradient>"

status:
  online: "<#34d399>●</#34d399>"
  offline: "<#f87171>●</#f87171>"

help:
  - "<separator>"
  - "<gradient:#a78bfa:#38bdf8><bold>Party Commands</bold></gradient>"
  - "<#a78bfa>/p invite <gray><player></gray> <dark_gray>–</dark_gray> <gray>Invite a player (or just /p <player>)"
  - "<#a78bfa>/p accept <gray><player></gray> <dark_gray>–</dark_gray> <gray>Accept an invite"
  - "<#a78bfa>/p deny <gray><player></gray> <dark_gray>–</dark_gray> <gray>Decline an invite"
  - "<#a78bfa>/p list <dark_gray>–</dark_gray> <gray>Show party members"
  - "<#a78bfa>/p leave <dark_gray>–</dark_gray> <gray>Leave your party"
  - "<#a78bfa>/p warp <dark_gray>–</dark_gray> <gray>Pull your party to your server"
  - "<#a78bfa>/p kick <gray><player></gray> <dark_gray>–</dark_gray> <gray>Remove a member"
  - "<#a78bfa>/p promote <gray><player></gray> <dark_gray>–</dark_gray> <gray>Transfer leadership"
  - "<#a78bfa>/p disband <dark_gray>–</dark_gray> <gray>Disband the party"
  - "<#a78bfa>/pc <gray>[message]</gray> <dark_gray>–</dark_gray> <gray>Party chat (no message = toggle)"
  - "<separator>"

invite:
  received:
    - "<separator>"
    - "<white><player></white> <gray>invited you to their party!"
    - "<gray>You have <white><time></white> to accept. <click:run_command:'/party accept <player>'><hover:show_text:'<green>Join the party of <player>'><#34d399><bold>[ACCEPT]</bold></#34d399></hover></click> <click:run_command:'/party deny <player>'><hover:show_text:'<red>Decline the invite'><#f87171><bold>[DENY]</bold></#f87171></hover></click>"
    - "<separator>"
  sent: "<prefix><white><player></white> <gray>invited <white><target></white> <gray>to the party. They have <white><time></white> <gray>to accept."
  expired: "<prefix><gray>The invite to <white><player></white> <gray>has expired."
  expired-target: "<prefix><gray>The party invite from <white><player></white> <gray>has expired."
  denied: "<prefix><white><player></white> <gray>declined the party invite."
  denied-self: "<prefix><gray>You declined <white><player></white><gray>'s party invite."

party:
  created: "<prefix><#34d399>You created a party."
  joined: "<prefix><#34d399>You joined <white><player></white>'s party!"
  left: "<prefix><gray>You left the party."
  kicked: "<prefix><#f87171>You were removed from the party by <white><player></white>."

member:
  joined: "<prefix><white><player></white> <#34d399>joined the party."
  left: "<prefix><white><player></white> <gray>left the party."
  kicked: "<prefix><white><player></white> <gray>was removed from the party by <white><leader></white>."
  disconnected: "<prefix><white><player></white> <gray>disconnected. They have <white><time></white> <gray>to rejoin before being removed."
  reconnected: "<prefix><white><player></white> <#34d399>reconnected."
  timed-out: "<prefix><white><player></white> <gray>was removed from the party after being offline too long."

leader:
  disconnected: "<prefix><gray>The party leader <white><player></white> <gray>disconnected. A new leader will be picked in <white><time></white> <gray>if they don't return."
  changed: "<prefix><white><player></white> <gray>is now the <gradient:#a78bfa:#38bdf8>party leader</gradient><gray>."
  promoted: "<prefix><white><player></white> <gray>promoted <white><target></white> <gray>to <gradient:#a78bfa:#38bdf8>party leader</gradient><gray>."

disband:
  leader: "<prefix><#f87171><white><player></white> disbanded the party."
  empty: "<prefix><gray>The party was disbanded: nobody else is in it."

warp:
  summoned: "<prefix><gray>Your party leader <white><player></white> <gray>summoned you to <white><server></white><gray>."
  sent: "<prefix><gray>Warping <white><count></white> <gray>member(s) to <white><server></white><gray>."
  following: "<prefix><gray>Following <white><player></white> <gray>to <white><server></white><gray>..."

chat:
  format: "<gradient:#a78bfa:#38bdf8><bold>Party</bold></gradient> <dark_gray>»</dark_gray> <white><player></white><dark_gray>:</dark_gray> <#e5e7eb><message>"
  muted-notice: "<gradient:#a78bfa:#38bdf8><bold>Party</bold></gradient> <dark_gray>»</dark_gray> <white><player></white><dark_gray>:</dark_gray> <gray><italic>I am currently muted, so I can't reply to your messages or send any.</italic>"
  toggled-on: "<prefix><#34d399>Party chat locked on.</#34d399> <gray>Everything you type now goes to your party. Type <white>/pc</white> again to switch back."
  toggled-off: "<prefix><gray>Party chat lock <#f87171>off</#f87171><gray>. You are back in public chat."
  needs-bridge: "<prefix><#f87171>The party chat lock isn't available on this server.</#f87171> <gray>Use <white>/pc <message></white> instead."
  lock-lost: "<prefix><gray>Party chat lock turned off: this server doesn't support it. Use <white>/pc <message></white>."

list:
  header:
    - "<separator>"
    - "<gradient:#a78bfa:#38bdf8><bold>Party Members</bold></gradient> <dark_gray>(<gray><count></gray>/<gray><max></gray>)</dark_gray>"
  leader: "<gray>Leader</gray> <dark_gray>»</dark_gray> <status> <white><player></white>"
  member: "<gray>Member</gray> <dark_gray>»</dark_gray> <status> <white><player></white>"
  footer: "<separator>"

error:
  players-only: "<prefix><#f87171>Only players can use this command."
  usage: "<prefix><#f87171>Usage: <gray><usage>"
  player-not-found: "<prefix><#f87171>No online player named <white><player></white>."
  player-offline: "<prefix><#f87171>That player is not online."
  not-in-party: "<prefix><#f87171>You are not in a party."
  not-leader: "<prefix><#f87171>Only the party leader can do that."
  self: "<prefix><#f87171>You can't target yourself."
  already-in-party: "<prefix><#f87171>You are already in a party. Leave it first with <white>/p leave</white>."
  target-in-party: "<prefix><#f87171>That player is already in a party."
  target-not-in-party: "<prefix><#f87171>That player is not in your party."
  already-invited: "<prefix><#f87171>That player already has a pending invite."
  no-invite: "<prefix><#f87171>You have no pending invite from that player."
  party-full: "<prefix><#f87171>The party is full."
  no-one-to-warp: "<prefix><#f87171>There is no online member to warp."
  muted: "<prefix><#f87171>You are muted and can't use party chat. Your mute ends in <white><time></white>."
  muted-permanent: "<prefix><#f87171>You are permanently muted and can't use party chat."
  unavailable: "<prefix><#f87171>The party service is temporarily unavailable. Please try again."
